<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Study Timer (Enhanced Review)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom style for the canvas */
        #pdf-canvas {
            border: 1px solid #e2e8f0; /* gray-200 */
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md */
            /* Ensure the canvas maintains a defined max-width */
            max-width: 100%;
            height: auto; /* Important for scaling */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4 sm:p-8">

    <div class="w-full max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">PDF Page Study Timer</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label for="pdf-file" class="block text-sm font-medium text-gray-700 mb-1">1. Choose PDF File</label>
                    <input type="file" id="pdf-file" accept="application/pdf" class="w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-lg file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100 transition-colors cursor-pointer">
                </div>

                <div>
                    <label for="page-timer" class="block text-sm font-medium text-gray-700 mb-1">2. Time per Page (Seconds)</label>
                    <select id="page-timer" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="10">10 Seconds (Test)</option>
                        <option value="60">1 Minute</option>
                        <option value="120" selected>2 Minutes</option>
                        <option value="180">3 Minutes</option>
                        <option value="300">5 Minutes</option>
                        <option value="600">10 Minutes</option>
                    </select>
                </div>

                <div>
                    <label for="break-interval" class="block text-sm font-medium text-gray-700 mb-1">3. Study for (minutes)</label>
                    <input type="number" id="break-interval" value="45" min="0" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., 45 (0 to disable)">
                </div>

                <div>
                    <label for="break-duration" class="block text-sm font-medium text-gray-700 mb-1">4. Break for (minutes)</label>
                    <input type="number" id="break-duration" value="5" min="0" class="w-full p-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., 5">
                </div>

                <div class="md:col-span-2">
                    <button id="start-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        5. Load & Start
                    </button>
                </div>
            </div>
        </div>

        <div id="pdf-controls" class="hidden w-full bg-white p-4 rounded-lg shadow-md mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <button id="prev-page" class="bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors disabled:opacity-50" disabled>
                        Previous
                    </button>
                    <button id="next-page" class="bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors disabled:opacity-50" disabled>
                        Next
                    </button>
                    <button id="pause-resume" class="bg-yellow-500 text-white font-medium py-2 px-4 rounded-lg hover:bg-yellow-600 transition-colors">
                        Pause
                    </button>
                </div>
                
                <div class="flex flex-col sm:flex-row items-center gap-4 text-gray-700">
                    <span id="page-info" class="font-medium">Page 0 of 0</span>
                    <span id="total-timer-display" class="font-bold text-lg text-gray-700 bg-gray-100 py-1 px-3 rounded-lg">
                        Total: 00:00
                    </span>
                    <span id="timer-display" class="font-bold text-lg text-blue-600 bg-blue-100 py-1 px-3 rounded-lg">
                        Page: 00:00
                    </span>
                </div>
            </div>
        </div>

        <div id="pdf-viewer" class="w-full">
            <canvas id="pdf-canvas" class="w-full h-auto"></canvas>
        </div>

        <div id="message-box" class="hidden fixed top-0 left-0 right-0 p-4 bg-yellow-500 text-white flex items-center justify-center z-50 shadow-lg">
            <p id="message-text" class="text-lg font-medium"></p>
        </div>

    </div>

    <script>
        // Set worker source for PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // DOM Elements
        const fileInput = document.getElementById('pdf-file');
        const timerSelect = document.getElementById('page-timer');
        const startBtn = document.getElementById('start-btn');
        const breakIntervalInput = document.getElementById('break-interval');
        const breakDurationInput = document.getElementById('break-duration');
        
        const controlsPanel = document.getElementById('pdf-controls');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const pauseBtn = document.getElementById('pause-resume');
        
        const pageInfo = document.getElementById('page-info');
        const timerDisplay = document.getElementById('timer-display');
        const totalTimerDisplay = document.getElementById('total-timer-display'); 
        
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        const viewerContainer = document.getElementById('pdf-viewer');
        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');

        // App State
        let pdfDoc = null;
        let pageNum = 1;
        let totalPages = 0;
        let pageRendering = false;
        let pageNumPending = null;
        let timerInterval = null;
        let totalTimeRemaining = 0;
        let isPaused = false; 
        let desiredScale = 1.5; 
        let isReviewing = false; 

        // Persistent page timer logic
        let pageTimers = []; 
        let pageTimeRemaining = 0; 

        // Break timer state
        let breakInterval = 0; 
        let breakDuration = 0; 
        let timeUntilBreak = 0; 
        let onBreak = false;

        /**
         * Shows a message banner. (Now non-blocking due to CSS change)
         */
        function showMessage(text) {
            messageText.innerHTML = text;
            messageBox.classList.remove('hidden');
        }

        /**
         * Hides the message banner.
         */
        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        /**
         * Renders a specific page of the PDF, accounting for Device Pixel Ratio (DPR) 
         * for sharp rendering on both desktop and mobile.
         */
        function renderPage(num) {
            pageRendering = true;
            
            // 1. Get the Device Pixel Ratio (DPR)
            const dpr = window.devicePixelRatio || 1; 

            pdfDoc.getPage(num).then(page => {
                const viewportAtScale1 = page.getViewport({ scale: 1 });
                const containerWidth = viewerContainer.clientWidth;
                
                // 2. Calculate the base scale needed to fit the container
                let scale = containerWidth / viewportAtScale1.width;
                
                // 3. Create the viewport using the base scale
                const viewport = page.getViewport({ scale: scale }); 
                
                // 4. Set the *actual* drawing dimensions (canvas.width/height) by multiplying with DPR
                canvas.height = viewport.height * dpr;
                canvas.width = viewport.width * dpr;
                
                // 5. Set the *visual* (CSS) dimensions to the calculated viewport size
                canvas.style.height = viewport.height + 'px';
                canvas.style.width = viewport.width + 'px';

                // 6. Scale the canvas context to match the DPR. This utilizes the larger canvas area.
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    
                    // IMPORTANT: Reset the context scale after rendering is done
                    ctx.setTransform(1, 0, 0, 1, 0, 0); 
                    
                    pageInfo.textContent = `Page ${num} of ${totalPages}`;
                    prevBtn.disabled = (num <= 1);
                    nextBtn.disabled = (num >= totalPages);

                    pageTimeRemaining = pageTimers[num - 1]; 
                    updatePageTimerDisplay();

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
        }

        /**
         * If another page is rendering, queue the new page. Otherwise, render it.
         */
        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        /**
         * Advances to the next page (used by auto-advance and manual click).
         */
        function advancePage() {
            if (pageNum >= totalPages) {
                return;
            }
            
            let remaining = pageTimers[pageNum - 1];

            // Time Rollover Logic: Only if time was left
            if (remaining > 0) {
                // Check if the next page exists before adding time
                if (pageNum < totalPages) {
                    pageTimers[pageNum] += remaining;
                }
            }
            
            // Set current page's timer to 0 since we are leaving it
            pageTimers[pageNum - 1] = 0; 

            pageNum++;
            queueRenderPage(pageNum);

            // If we were reviewing and now moving forward, resume timer
            if (isReviewing) {
                isReviewing = false;
                if (isPaused) { 
                    togglePause();
                }
            }
        }
        
        /**
         * Ticks the timer down by one second.
         */
        function countdown() {
            // Check for both user pause and review pause
            if (isPaused || isReviewing) {
                return; 
            }

            // --- Handle Break State ---
            if (onBreak) {
                timeUntilBreak--; 
                
                const minutes = Math.floor(timeUntilBreak / 60);
                let seconds = timeUntilBreak % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                showMessage(`It's break time! ☕<br>Time remaining: ${minutes}:${seconds}`);

                if (timeUntilBreak <= 0) {
                    onBreak = false;
                    hideMessage();
                    if (breakInterval > 0) {
                        timeUntilBreak = breakInterval; 
                    }
                }
                return;
            }

            // --- Handle Study State (not on break) ---
            
            if (totalTimeRemaining <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                showMessage('Study session complete! 🎉');
                setTimeout(hideMessage, 3000);
                return; 
            }

            // Tick down total time
            totalTimeRemaining--;
            updateTotalTimerDisplay();

            // Tick down page time 
            if (pageTimeRemaining > 0) {
                pageTimeRemaining--;
                pageTimers[pageNum - 1] = pageTimeRemaining;
                updatePageTimerDisplay();
            } else if (pageTimeRemaining === 0) {
                updatePageTimerDisplay();
            }
            
            // Check for Automatic Page Advance
            if (pageTimeRemaining <= 0 && pageNum < totalPages) {
                advancePage();
            }
            
            // Tick down break timer
            if (breakInterval > 0) {
                timeUntilBreak--;
            }

            // Check for Break
            if (breakInterval > 0 && timeUntilBreak <= 0) {
                onBreak = true;
                timeUntilBreak = breakDuration; 
                
                const minutes = Math.floor(timeUntilBreak / 60);
                let seconds = timeUntilBreak % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                showMessage(`It's break time! ☕<br>Time remaining: ${minutes}:${seconds}`);
                
                return;
            }
        }


        /**
         * Formats the remainingTime and updates the page timer display.
         */
        function updatePageTimerDisplay() {
            let pageTimeLeft = pageTimeRemaining;
            
            if (pageTimeLeft < 0) {
                pageTimeLeft = 0;
            }

            const minutes = Math.floor(pageTimeLeft / 60);
            let seconds = pageTimeLeft % 60;
            
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            let prefix = '';
            if (isPaused) {
                prefix = '⏸️ Paused:';
            } else if (isReviewing) {
                prefix = '👀 Review:'; 
            } else if (pageTimeLeft <= 0) {
                prefix = (pageNum === totalPages ? '✅ Done:' : '➡️ Next:');
            } else {
                 prefix = 'Page:';
            }

            timerDisplay.textContent = `${prefix} ${minutes}:${seconds}`.trim();
        }

        /**
         * Formats totalTimeRemaining and updates the total timer display.
         */
        function updateTotalTimerDisplay() {
            const totalSeconds = totalTimeRemaining;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const fHours = hours > 0 ? String(hours).padStart(2, '0') + ':' : '';
            const fMinutes = String(minutes).padStart(2, '0');
            const fSeconds = String(seconds).padStart(2, '0');

            totalTimerDisplay.textContent = `Total: ${fHours}${fMinutes}:${fSeconds}`;
        }


        /**
         * Navigates to the next page (manual button click).
         */
        function goToNextPage() {
            if (pageNum >= totalPages) {
                return;
            }
            advancePage();
        }

        /**
         * Navigates to the previous page.
         */
        function goToPrevPage() {
            if (pageNum <= 1) {
                return;
            }
            
            // 1. Save the current state of the page's timer before leaving it
            pageTimers[pageNum - 1] = pageTimeRemaining; 
            
            // 2. Stop the timer and flag review state
            isReviewing = true;
            
            // 3. Navigate
            pageNum--;
            queueRenderPage(pageNum);
            
            // 4. Update timer display immediately to show 'Review' status.
            updatePageTimerDisplay();
            // REMOVED showMessage call here to avoid the pop-up
        }

        /**
         * Toggles the pause/resume state of the timer.
         */
        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = 'Resume';
                pauseBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                pauseBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                showMessage('Timer Paused ⏸️');
            } else {
                pauseBtn.textContent = 'Pause';
                pauseBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                pauseBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                
                // If we were in review mode and unpaused, clear the review state
                if (isReviewing) {
                    isReviewing = false; 
                }
                
                if (onBreak) {
                    const minutes = Math.floor(timeUntilBreak / 60);
                    let seconds = timeUntilBreak % 60;
                    seconds = seconds < 10 ? '0' + seconds : seconds;
                    showMessage(`It's break time! ☕<br>Time remaining: ${minutes}:${seconds}`);
                } else {
                    hideMessage();
                }
            }
            updatePageTimerDisplay(); 
        }

        // --- Event Listeners ---

        /**
         * Main "Start" button click handler.
         */
        startBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) {
                showMessage('Please select a PDF file first.');
                setTimeout(hideMessage, 2000);
                return;
            }
            
            const fileReader = new FileReader();

            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                
                showMessage('Loading PDF...');

                const loadingTask = pdfjsLib.getDocument(typedarray);
                loadingTask.promise.then(pdf => {
                    hideMessage();
                    pdfDoc = pdf;
                    totalPages = pdf.numPages;
                    pageNum = 1;
                    isPaused = false;
                    isReviewing = false; 
                    onBreak = false; 
                    
                    const durationPerCoPage = parseInt(timerSelect.value, 10);
                    
                    totalTimeRemaining = totalPages * durationPerCoPage; 
                    
                    pageTimers = new Array(totalPages).fill(durationPerCoPage);
                    pageTimeRemaining = pageTimers[0]; 

                    breakInterval = parseInt(breakIntervalInput.value, 10) * 60;
                    breakDuration = parseInt(breakDurationInput.value, 10) * 60;
                    
                    timeUntilBreak = breakInterval > 0 ? breakInterval : 0;
                    
                    updateTotalTimerDisplay();
                    updatePageTimerDisplay();
                    pauseBtn.textContent = 'Pause';
                    pauseBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                    pauseBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                    
                    controlsPanel.classList.remove('hidden');

                    renderPage(pageNum);

                    if (timerInterval) {
                        clearInterval(timerInterval);
                    }
                    timerInterval = setInterval(countdown, 1000);

                }, reason => {
                    console.error(reason);
                    showMessage('Error loading PDF file.');
                    setTimeout(hideMessage, 3000);
                });
            };

            fileReader.readAsArrayBuffer(file);
        });

        // Navigation button listeners
        prevBtn.addEventListener('click', goToPrevPage);
        nextBtn.addEventListener('click', goToNextPage);
        pauseBtn.addEventListener('click', togglePause);

    </script>
</body>
</html>
