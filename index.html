<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webapp Demolished!</title>
    <style>
        /* Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2d1313, #da3a1b);
            overflow: hidden;
            color: #fff;
        }

        /* Main message */
        .container {
            text-align: center;
            animation: shake 0.8s infinite;
        }

        h1 {
            font-size: 4em;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.5em;
            margin-top: 20px;
            animation: fadeIn 2s ease-in-out forwards;
            opacity: 0;
        }

        /* Shake animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Fade in */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Optional: falling debris */
        .debris {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💥 OH NO! 💥</h1>
        <p>This webapp has been demolished by its own creator!</p>
    </div>

    <script>
        // Create random falling debris
        for(let i=0; i<50; i++){
            let div = document.createElement('div');
            div.classList.add('debris');
            div.style.left = Math.random() * 100 + 'vw';
            div.style.width = Math.random() * 8 + 4 + 'px';
            div.style.height = div.style.width;
            div.style.animationDuration = (2 + Math.random() * 3) + 's';
            div.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(div);
        }
    </script>
</body>
</html>
